name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: support_tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Setup Prisma environment
      working-directory: ./backend
      run: |
        echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/support_tickets_test" > .env
        echo "JWT_SECRET=test_secret" >> .env
        
    - name: Run Prisma migrations
      working-directory: ./backend
      run: npx prisma migrate deploy
      
    - name: Run backend tests
      working-directory: ./backend
      run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      env:
        VITE_API_URL: /api
